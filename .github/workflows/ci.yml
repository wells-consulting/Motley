name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test

  docs:
    name: Build Documentation
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build
        run: >
          xcodebuild docbuild
          -scheme Motley
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/dd"
          -skipPackagePluginValidation
          OTHER_DOCC_FLAGS="--warnings-as-errors"
          -quiet
